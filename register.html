<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container form-container">
    <div class="card form-card">
        <div class="card-body">
            <h3 class="text-center">Register</h3>

            <form id="registerForm">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" class="form-control" id="regUsername">
                    <small class="error" id="regUsernameError"></small>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="text" class="form-control" id="regEmail">
                    <small class="error" id="regEmailError"></small>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control"
                            id="regPassword" onkeyup="checkStrength()">
                        <button type="button" class="btn btn-outline-secondary"
                            onclick="togglePassword('regPassword')">
                            Show
                        </button>
                    </div>

                    <small id="strengthText"></small><br>
                    <small class="error" id="regPasswordError"></small>
                </div>

                <div class="mb-3">
                    <label>Date of Birth</label>
                    <input type="date" class="form-control" id="regDob">
                    <small class="error" id="regDobError"></small>
                </div>

                <div class="mb-3">
                    <label>State</label>
                    <input type="text" class="form-control" id="regState">
                    <small class="error" id="regStateError"></small>
                </div>

                <div class="mb-3">
                    <label>Country</label>
                    <input type="text" class="form-control" id="regCountry">
                    <small class="error" id="regCountryError"></small>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Register
                </button>
            </form>

            <p class="mt-3 text-center">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
